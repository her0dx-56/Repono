
# Detect browser page requests and direct download requests
map $http_accept $request_wants_html {
    default 0;
    ~*text/html 1;
}

map $arg_download $is_download_request {
    default 0;
    ~*^true$ 1;
}

map "$request_wants_html:$is_download_request" $serve_share_page {
    default 0;
    "1:0" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /files {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share {
        # Browser page requests should load the React app.
        # Download requests should go to the Go backend.
        if ($serve_share_page = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:9000;
    }

    location /auth-test {
        proxy_pass http://backend:9000;
    }

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
